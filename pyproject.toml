[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yieldcurve"
version = "0.1.0"
description = "US and Hungarian government bond yield curve analysis: Nelson-Siegel fitting, PCA, and a RAG + LangGraph agent over Fed and MNB statements."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "plotly>=5.22",
    "fredapi>=0.5",
    "pyarrow>=16.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "ipykernel>=6.29",
    "nbformat>=5.10",  # Plotly figures in notebooks
    "nbclient>=0.10",  # `jupyter execute` for running notebooks headless
    "kaleido>=1.0",  # static PNG export of Plotly figures
]

[tool.hatch.build.targets.wheel]
packages = ["src/yieldcurve"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not network'"
markers = ["network: hits live external services (run with `pytest -m network`)"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "PD"]
